name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk FotoGeotag.apk

      - uses: actions/upload-artifact@v4
        with:
          name: FotoGeotag-apk
          path: FotoGeotag.apk

      - name: Publish Release (unduh langsung tanpa login)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest FotoGeotag.apk \
            --title "Foto Geotag (versi terbaru)" \
            --notes "Unduh FotoGeotag.apk di bawah lalu instal di Android."
